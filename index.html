<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Project Folder Launcher</title>
  <link rel="stylesheet" href="src/ui/industry.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="popup window blueprint" role="dialog" aria-label="Recherche de projet">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

    <section class="pane-list" aria-label="Recherche et dossiers récents">
      <label class="search-field" id="searchField">
        <ui-icon name="search" size="16" class="search-icon"></ui-icon>
        <span class="search-input-wrap">
          <input type="text" id="projectInput" aria-label="Numéro de projet" placeholder="N° de projet (ex : 4889)"
            autocomplete="off" spellcheck="false" maxlength="9">
          <span class="search-mirror" id="searchMirror" aria-hidden="true"></span>
          <span class="search-ghost" id="searchGhost" aria-hidden="true"></span>
        </span>
        <span class="key-chip" id="shortcutChip" aria-label="Raccourci global"></span>
      </label>
      <div class="kicker"><span>Récents</span><span id="recentCount"></span></div>
      <div class="list recent-list" id="recentList" role="listbox" aria-label="Dossiers ouverts récemment"></div>
    </section>

    <section class="pane-detail" id="detail" aria-live="polite"></section>
  </main>

  <script src="src/shared/launcher-shared.js"></script>
  <script src="src/shared/icons.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
