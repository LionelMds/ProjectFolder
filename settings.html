<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'">
    <title>Paramètres</title>
    <link rel="stylesheet" href="src/ui/industry.css">
    <link rel="stylesheet" href="settings.css">
</head>

<body>
    <main class="settings window blueprint" role="dialog" aria-label="Paramètres Project Folder Launcher">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

        <header class="title-bar settings-header">
            <h1><ui-icon name="settings" size="16"></ui-icon>Paramètres</h1>
            <button class="icon-btn" id="closeBtn" type="button" title="Fermer" aria-label="Fermer">
                <ui-icon name="x" size="16"></ui-icon>
            </button>
        </header>

        <nav class="settings-nav" aria-label="Sections">
            <div class="kicker"><span>Sections</span></div>
            <div class="list" id="sectionList" role="tablist" aria-orientation="vertical"></div>
            <span class="settings-version text-muted" id="appVersion"></span>
        </nav>

        <section class="settings-content" id="sectionContent" role="tabpanel"></section>

        <footer class="dialog-footer settings-footer">
            <span class="settings-status" id="settingsStatus" role="status" aria-live="polite"></span>
            <button class="btn btn-secondary" id="cancelBtn" type="button">Annuler</button>
            <button class="btn btn-primary blueprint" id="saveBtn" type="button">
                <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                Enregistrer
            </button>
        </footer>
    </main>

    <script src="src/shared/launcher-shared.js"></script>
    <script src="src/shared/icons.js"></script>
    <script src="settings-renderer.js"></script>
</body>

</html>
