<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'">
    <title>Mise à jour</title>
    <link rel="stylesheet" href="src/ui/industry.css">
    <link rel="stylesheet" href="update.css">
</head>

<body>
    <main class="update window blueprint" role="dialog" aria-label="Mise à jour Project Folder Launcher">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

        <header class="title-bar update-header">
            <h1><ui-icon name="download" size="16"></ui-icon>Mise à jour</h1>
            <button class="icon-btn" id="closeBtn" type="button" aria-label="Fermer">
                <ui-icon name="x" size="16"></ui-icon>
            </button>
        </header>

        <section class="update-versions" id="versionPane" aria-label="Versions"></section>
        <section class="update-detail" id="detailPane" aria-live="polite"></section>

        <footer class="dialog-footer update-footer">
            <button class="btn btn-secondary" id="laterBtn" type="button">Plus tard</button>
            <button class="btn btn-primary blueprint" id="primaryBtn" type="button">
                <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                <span id="primaryLabel">Vérifier</span>
            </button>
        </footer>
    </main>

    <script src="src/shared/launcher-shared.js"></script>
    <script src="src/shared/icons.js"></script>
    <script src="update-renderer.js"></script>
</body>

</html>
