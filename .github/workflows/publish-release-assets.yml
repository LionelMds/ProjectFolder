name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build. Signed releases must match tag v<package version>."
        required: true
        default: "main"
      platform:
        description: "Platform assets"
        required: true
        type: choice
        default: "all"
        options:
          - windows
          - macos
          - all
      windows_signing:
        description: "Unsigned Windows builds are kept as temporary Actions artifacts."
        required: true
        type: choice
        default: "signed"
        options:
          - signed
          - unsigned
      macos_signing:
        description: "Unsigned macOS builds are kept as temporary Actions artifacts."
        required: true
        type: choice
        default: "signed"
        options:
          - signed
          - unsigned

permissions:
  contents: write

jobs:
  windows:
    name: Windows release assets
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'all' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.12"
          cache: npm

      - name: Validate signed release tag
        if: ${{ inputs.windows_signing == 'signed' }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $tagCommit = git rev-list -n 1 $tag
          $headCommit = git rev-parse HEAD
          if (-not $tagCommit) {
            throw "Release tag $tag does not exist."
          }
          if ($tagCommit.Trim() -ne $headCommit.Trim()) {
            throw "Release tag $tag does not point to the checked-out commit."
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate Windows signing secrets
        if: ${{ inputs.windows_signing == 'signed' }}
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { $missing += "WIN_CSC_LINK" }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) { $missing += "WIN_CSC_KEY_PASSWORD" }
          if ($missing.Count -gt 0) {
            throw "Missing Windows signing secrets: $($missing -join ', ')"
          }

      - name: Install dependencies
        run: npm ci

      - name: Check source and tests
        run: npm run check

      - name: Build Windows installer
        run: npm run build:win -- --publish never
        env:
          CSC_LINK: ${{ inputs.windows_signing == 'signed' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.windows_signing == 'signed' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.windows_signing == 'signed' && 'true' || 'false' }}

      - name: Verify Windows signature
        if: ${{ inputs.windows_signing == 'signed' }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter "ProjectFolderLauncher-Setup-*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($signature.Status -ne "Valid") {
            throw "Installer signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Valid Authenticode signature: $($signature.SignerCertificate.Subject)"

      - name: Publish signed Windows updater assets
        if: ${{ inputs.windows_signing == 'signed' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem dist -Filter "ProjectFolderLauncher-Setup-*.exe").FullName
          gh release view $env:RELEASE_TAG
          gh release upload $env:RELEASE_TAG $installer "dist/latest.yml" --clobber

      - name: Upload temporary unsigned Windows installer
        if: ${{ inputs.windows_signing == 'unsigned' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ProjectFolderLauncher-Windows-UNSIGNED
          path: dist/ProjectFolderLauncher-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS release assets
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'all' }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.12"
          cache: npm

      - name: Validate signed release tag
        if: ${{ inputs.macos_signing == 'signed' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          tag_commit="$(git rev-list -n 1 "$tag")"
          head_commit="$(git rev-parse HEAD)"
          if [ -z "$tag_commit" ]; then
            echo "::error::Release tag $tag does not exist."
            exit 1
          fi
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::Release tag $tag does not point to the checked-out commit."
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Validate Apple signing and notarization secrets
        if: ${{ inputs.macos_signing == 'signed' }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -z "$CSC_LINK" ] && missing+=("CSC_LINK")
          [ -z "$CSC_KEY_PASSWORD" ] && missing+=("CSC_KEY_PASSWORD")
          [ -z "$APPLE_ID" ] && missing+=("APPLE_ID")
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [ -z "$APPLE_TEAM_ID" ] && missing+=("APPLE_TEAM_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Apple secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check source and tests
        run: npm run check

      - name: Import Apple Developer certificate
        if: ${{ inputs.macos_signing == 'signed' }}
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build temporary unsigned macOS DMG
        if: ${{ inputs.macos_signing == 'unsigned' }}
        run: npx electron-builder --mac dmg --universal --publish never -c.mac.identity=null -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload temporary unsigned macOS DMG
        if: ${{ inputs.macos_signing == 'unsigned' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ProjectFolderLauncher-macOS-UNSIGNED
          path: dist/ProjectFolderLauncher-*-mac.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Build signed macOS application
        if: ${{ inputs.macos_signing == 'signed' }}
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail

          npx electron-builder --mac dir --x64 \
            --publish never \
            -c.directories.output=dist/mac-x64 \
            -c.mac.identity=null \
            -c.mac.notarize=false
          npx electron-builder --mac dir --arm64 \
            --publish never \
            -c.directories.output=dist/mac-arm64 \
            -c.mac.identity=null \
            -c.mac.notarize=false

          x64_app="$(find dist/mac-x64 -name 'Project Folder Launcher.app' -type d | head -n 1)"
          arm64_app="$(find dist/mac-arm64 -name 'Project Folder Launcher.app' -type d | head -n 1)"
          test -n "$x64_app"
          test -n "$arm64_app"
          x64_app="$PWD/$x64_app"
          arm64_app="$PWD/$arm64_app"

          find "$x64_app" "$arm64_app" -type d -name '_CodeSignature' -prune -exec rm -rf {} +
          find "$x64_app" "$arm64_app" -type l -name 'CodeResources' -delete

          app_path="$PWD/dist/mac-universal/Project Folder Launcher.app"
          X64_APP="$x64_app" ARM64_APP="$arm64_app" OUT_APP="$app_path" node <<'NODE'
          const { makeUniversalApp } = require('@electron/universal');

          makeUniversalApp({
            x64AppPath: process.env.X64_APP,
            arm64AppPath: process.env.ARM64_APP,
            outAppPath: process.env.OUT_APP,
            force: true,
            mergeASARs: true
          }).catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          signing_identity="$(security find-identity -v -p codesigning signing_temp.keychain | awk 'NR == 1 { print $2 }')"
          if [[ ! "$signing_identity" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::No usable Apple code-signing identity was found."
            exit 1
          fi

          APP_PATH_TO_SIGN="$app_path" APP_SIGNING_IDENTITY="$signing_identity" node <<'NODE'
          const path = require('node:path');
          const { signAsync } = require('@electron/osx-sign');

          const appPath = path.resolve(process.env.APP_PATH_TO_SIGN);
          const mainEntitlements = path.resolve('build/entitlements.mac.plist');
          const inheritedEntitlements = path.resolve('build/entitlements.mac.inherit.plist');

          signAsync({
            app: appPath,
            keychain: 'signing_temp',
            identity: process.env.APP_SIGNING_IDENTITY,
            identityValidation: false,
            platform: 'darwin',
            type: 'distribution',
            hardenedRuntime: true,
            preAutoEntitlements: false,
            preEmbedProvisioningProfile: false,
            strictVerify: true,
            optionsForFile(filePath) {
              return {
                entitlements: path.resolve(filePath) === appPath
                  ? mainEntitlements
                  : inheritedEntitlements,
                hardenedRuntime: true
              };
            }
          }).catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signed_team_id="$(codesign -d --verbose=4 "$app_path" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')"
          if [ -z "$signed_team_id" ]; then
            echo "::error::The signed application does not contain an Apple team identifier."
            exit 1
          fi
          if [ "$signed_team_id" != "$APPLE_TEAM_ID" ]; then
            echo "::error::The signing certificate and APPLE_TEAM_ID belong to different Apple teams."
            exit 1
          fi
          echo "Verified Apple signing team: $signed_team_id"
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Notarize and staple macOS application
        if: ${{ inputs.macos_signing == 'signed' }}
        timeout-minutes: 120
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          notary_zip="$RUNNER_TEMP/project-folder-launcher-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package notarized macOS installer and updater assets
        if: ${{ inputs.macos_signing == 'signed' }}
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --mac dmg zip --universal \
            --prepackaged "$APP_PATH" \
            --publish never \
            -c.mac.identity=null \
            -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish signed macOS assets
        if: ${{ inputs.macos_signing == 'signed' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg="$(find dist -maxdepth 1 -name 'ProjectFolderLauncher-*-mac.dmg' -type f | head -n 1)"
          zip="$(find dist -maxdepth 1 -name 'ProjectFolderLauncher-*-mac.zip' -type f | head -n 1)"
          test -n "$dmg"
          test -n "$zip"
          test -f dist/latest-mac.yml
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$dmg" "$zip" dist/latest-mac.yml --clobber
