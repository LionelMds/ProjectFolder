name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build. Use main to attach assets to the package.json version release."
        required: true
        default: "main"
      platform:
        description: "Platform assets to publish"
        required: true
        type: choice
        default: "macos"
        options:
          - windows
          - macos
          - all
      macos_signing:
        description: "macOS signing mode. Use unsigned only for temporary test releases."
        required: true
        type: choice
        default: "unsigned"
        options:
          - unsigned
          - signed

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS assets
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'all' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish Windows release assets
        run: npm run release:win
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    name: macOS release assets
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'all' }}
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate macOS signing secrets
        if: ${{ inputs.macos_signing == 'signed' }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -z "$CSC_LINK" ] && missing+=("CSC_LINK")
          [ -z "$CSC_KEY_PASSWORD" ] && missing+=("CSC_KEY_PASSWORD")
          [ -z "$APPLE_ID" ] && missing+=("APPLE_ID")
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [ -z "$APPLE_TEAM_ID" ] && missing+=("APPLE_TEAM_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required macOS signing/notarization secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate Apple notarization credentials
        if: ${{ inputs.macos_signing == 'signed' }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > /tmp/notary-history.json
          python3 - <<'PY'
          import json
          with open('/tmp/notary-history.json', 'r', encoding='utf-8') as handle:
              history = json.load(handle)
          submissions = history.get('history', [])
          print(f"notarytool credentials OK, visible submissions: {len(submissions)}")
          PY

      - name: Publish temporary unsigned macOS DMG assets
        if: ${{ inputs.macos_signing == 'unsigned' }}
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build signed macOS app
        if: ${{ inputs.macos_signing == 'signed' }}
        timeout-minutes: 45
        shell: bash
        run: |
          npx electron-builder --mac dir --universal --publish never -c.mac.notarize=false
          app_path="$(find dist -maxdepth 3 -name 'Project Folder Launcher.app' -type d | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "::error::Signed .app bundle was not generated."
            find dist -maxdepth 4 -print
            exit 1
          fi
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"
          echo "Signed app bundle: $app_path"
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Notarize and staple macOS app
        if: ${{ inputs.macos_signing == 'signed' }}
        timeout-minutes: 120
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "${APP_PATH:-}" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::APP_PATH is missing or invalid: ${APP_PATH:-}"
            exit 1
          fi

          notary_zip="$RUNNER_TEMP/project-folder-launcher-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$notary_zip"
          echo "Submitting $notary_zip to Apple notarization."

          xcrun notarytool submit "$notary_zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > "$RUNNER_TEMP/notary-submit.json"

          cat "$RUNNER_TEMP/notary-submit.json"

          submission_id="$(python3 - <<'PY'
          import json
          import os
          with open(os.environ["RUNNER_TEMP"] + "/notary-submit.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          print(payload.get("id", ""))
          PY
          )"

          if [ -z "$submission_id" ]; then
            echo "::error::Apple notarization did not return a submission id."
            exit 1
          fi

          status=""
          for attempt in $(seq 1 90); do
            xcrun notarytool info "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json > "$RUNNER_TEMP/notary-info.json"

            status="$(python3 - <<'PY'
          import json
          import os
          with open(os.environ["RUNNER_TEMP"] + "/notary-info.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          print(payload.get("status", "Unknown"))
          PY
          )"

            echo "Apple notarization status for $submission_id: $status ($attempt/90)"

            if [ "$status" = "Accepted" ]; then
              break
            fi

            if [ "$status" = "Invalid" ] || [ "$status" = "Rejected" ]; then
              xcrun notarytool log "$submission_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              exit 1
            fi

            sleep 60
          done

          if [ "$status" != "Accepted" ]; then
            echo "::error::Apple notarization timed out before acceptance."
            xcrun notarytool log "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Package notarized macOS updater assets
        if: ${{ inputs.macos_signing == 'signed' }}
        timeout-minutes: 45
        shell: bash
        run: |
          if [ -z "${APP_PATH:-}" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::APP_PATH is missing or invalid: ${APP_PATH:-}"
            exit 1
          fi
          npx electron-builder --mac dmg zip --universal --prepackaged "$APP_PATH" --publish never -c.mac.notarize=false
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach macOS assets to the existing release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const signingMode = '${{ inputs.macos_signing }}';

            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = `v${packageJson.version}`;
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });

            const distDir = path.join(process.cwd(), 'dist');
            const assets = fs.readdirSync(distDir)
              .filter((fileName) => {
                const isDmg = /^ProjectFolderLauncher-.+-mac\.dmg$/.test(fileName);
                const isZip = /^ProjectFolderLauncher-.+-mac\.zip$/.test(fileName);
                const isMacUpdaterMetadata = fileName === 'latest-mac.yml';
                return isDmg || (signingMode === 'signed' && (isZip || isMacUpdaterMetadata));
              })
              .sort();

            if (assets.length === 0) {
              core.setFailed('No macOS assets were generated in dist/.');
              return;
            }

            for (const fileName of assets) {
              const existingAsset = release.data.assets.find((asset) => asset.name === fileName);
              if (existingAsset) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existingAsset.id
                });
              }

              const filePath = path.join(distDir, fileName);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: fileName,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length
                }
              });
              core.info(`Uploaded ${fileName}`);
            }
